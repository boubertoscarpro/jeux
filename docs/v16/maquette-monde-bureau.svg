<text x="700.0" y="860.5" text-anchor="middle" font-size="12" fill="#1d1812">barres, temps, Accélérer</text>
<rect x="1312" y="744" width="72" height="40" rx="8" fill="#efe3c8" fill-opacity="0.92" stroke="#1d1812" stroke-width="2"/>
