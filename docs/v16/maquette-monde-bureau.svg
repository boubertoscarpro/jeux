<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, sans-serif" role="img" aria-label="Maquette : carte du monde, bureau 1400 × 900">
<title>Maquette : carte du monde, bureau 1400 × 900</title>
<rect width="1400" height="900" fill="#4d7236"/>
<rect width="1400" height="900" fill="#4d7236"/><path d="M200 0V900" stroke="#5b8db5" stroke-width="30"/><text x="700" y="450" text-anchor="middle" font-size="18" fill="#efe3c8">Carte du monde</text>
<rect x="16" y="12" width="300" height="60" rx="8" fill="#efe3c8" fill-opacity="0.92" stroke="#1d1812" stroke-width="2"/>
