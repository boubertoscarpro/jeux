<text x="1120.0" y="854.5" text-anchor="middle" font-size="12" fill="#1d1812">Guilde · Rapports · Lieux</text>
<rect x="16" y="124" width="300" height="60" rx="8" fill="#efe3c8" fill-opacity="0.92" stroke="#1d1812" stroke-width="2"/>
