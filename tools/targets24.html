<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Cibles v24</title>
<style>body{margin:0;background:#5f8a3a;font:12px Georgia,serif;color:#fff}#root{display:flex;flex-wrap:wrap;gap:4px;padding:4px}.c{text-align:center;background:rgba(0,0,0,.12);border-radius:8px}.c b{display:block;padding-bottom:4px}</style></head>
<body><div id="root"></div>
<script type="module">
// Planche des cibles de la carte du monde (v24) : chaque catégorie à ses paliers 1 à 4 ; ?only=a,b ; ?t=1,4
import { pen, drawFx } from '../src/ui/paint/paint.js';
import { bake } from '../src/ui/paint/bake.js';
import { TARGETS, FORT_STYLES } from '../src/ui/paint/art.js';
const S = 1, root = document.getElementById('root'), q = new URLSearchParams(location.search);
const tiers = (q.get('t') || '1,2,3,4').split(',').map(Number);
const only = (q.get('only') || Object.keys(TARGETS).join(',')).split(',');
function cell(label, draw) {
  const w = 200 * S, h = 230 * S, ox = 100 * S, oy = 150 * S;
  const c = document.createElement('div'); c.className = 'c';
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; c.appendChild(cv);
  const b = document.createElement('b'); b.textContent = label; c.appendChild(b); root.appendChild(c);
  const g = cv.getContext('2d'); const fx = [];
  const art = bake(w, h, (bg) => { const p = pen(bg, ox, oy, S, label); p.noGround = true; p.sg = g; p.fx = fx; draw(p); }, { s: S });
  g.drawImage(art, 0, 0); drawFx(g, fx);
}
for (const k of only) {
  if (k === 'kingdom') { FORT_STYLES.forEach((st, i) => cell(`royaume ${st.key}`, (p) => TARGETS.kingdom(p, 3, i, { style: i, color: ['#7a2a20', '#2f5fb0', '#4f8a3a', '#a07a1a', '#5a2a7a'][i], season: 'summer' }))); continue; }
  if (k === 'eventSite') { for (const ph of ['upcoming', 'active', 'boss', 'cleared']) cell(`événement ${ph}`, (p) => TARGETS.eventSite(p, 3, 0, { phase: ph, color: '#a8402a', season: 'summer' })); continue; }
  for (const t of tiers) cell(`${k} ${t}`, (p) => TARGETS[k](p, t, t, { active: true, season: 'summer' }));
}
</script></body></html>
