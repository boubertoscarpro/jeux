<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Bâtiments v26</title>
<style>body{margin:0;background:#5f8a3a;font:12px Georgia,serif;color:#fff}#root{display:flex;flex-wrap:wrap;gap:4px;padding:4px}.c{text-align:center;background:rgba(0,0,0,.12);border-radius:8px}.c b{display:block;padding-bottom:4px}</style></head>
<body><div id="root"></div>
<script type="module">
// Planche v26 : hôtel de ville, caserne, ferme, marché et forge aux paliers 0 à 5 ; puis Île de Cendre et métropole
import { pen, drawFx } from '../src/ui/paint/paint.js';
import { bake } from '../src/ui/paint/bake.js';
import { PAINT, EVENT_TARGETS } from '../src/ui/paint/art.js';
const S = 1, root = document.getElementById('root');
function cell(label, draw) {
  const w = 200 * S, h = 230 * S, ox = 100 * S, oy = 150 * S;
  const c = document.createElement('div'); c.className = 'c';
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; c.appendChild(cv);
  const b = document.createElement('b'); b.textContent = label; c.appendChild(b); root.appendChild(c);
  const g = cv.getContext('2d'); const fx = [];
  const art = bake(w, h, (bg) => { const p = pen(bg, ox, oy, S, label); p.noGround = true; p.sg = g; p.fx = fx; draw(p); }, { s: S });
  g.drawImage(art, 0, 0); drawFx(g, fx);
}
for (const k of ['townhall', 'barracks', 'farm', 'market', 'forge']) for (let t = 0; t <= 5; t++) cell(`${k} ${t}`, (p) => PAINT[k](p, t, 0, { active: true, season: 'summer' }));
cell('île de cendre', (p) => EVENT_TARGETS.isle(p, 3, 0, { owner: 'me' }));
cell('métropole', (p) => EVENT_TARGETS.metro(p, 4, 0, { style: 2, color: '#d4a017' }));
</script></body></html>
